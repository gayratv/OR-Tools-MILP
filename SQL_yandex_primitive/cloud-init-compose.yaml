#cloud-config
package_update: false
packages:
  - curl
  - jq
  - mc
  - ca-certificates

users:
  - name: yc-user
    groups: [sudo, docker]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMsT2ARMza/hqHGe2QqSAPTlUhh3yUimuVAXXjqsuLlm root@SOLIDWORKS2022

runcmd:
  - [ bash, -lc, |
      set -euo pipefail
      APP_DIR="/opt/app"
      BIN_DIR="$APP_DIR/bin"
      install -d -m 0755 "$BIN_DIR"

      # единственная ссылка, которую грузим здесь:
      URL_SETUP="https://raw.githubusercontent.com/<owner>/<repo>/<ref>/scripts/setup-compose.sh"

      echo "==> Download setup-compose.sh"
      curl -fsSL -o "$BIN_DIR/setup-compose.sh" "$URL_SETUP"
      chmod +x "$BIN_DIR/setup-compose.sh"

      echo "==> Run setup-compose.sh"
      "$BIN_DIR/setup-compose.sh"
    ]
