#cloud-config
datasource:
  Ec2:
    strict_id: false
ssh_pwauth: no

package_update: true
packages:
  - docker.io
  - docker-compose-plugin
  - jq
  - bash
  - mc
  - curl
  - ca-certificates

users:
  - name: yc-user
    groups: [sudo, docker]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMsT2ARMza/hqHGe2QqSAPTlUhh3yUimuVAXXjqsuLlm root@SOLIDWORKS2022


write_files:
  - path: /opt/app/yc-secrets-get.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      need() { command -v "$1" >/dev/null 2>&1 || { echo "Ошибка: требуется '$1'." >&2; exit 1; }; }
      need jq
      need yc
      need base64
      OUTPUT_ENV_FILE="/opt/app/.env"
      OUTPUT_BINARY_DIR="/opt/app/.mysql-out"
      mkdir -p "$OUTPUT_BINARY_DIR"
      echo "Получаю секреты из Yandex Lockbox..."
      PAYLOAD_JSON=$(yc lockbox payload get school-scheduler-app-secrets --format json)
      echo "$PAYLOAD_JSON" | jq -r '.entries[] | select(.text_value != null) | "\(.key)=\(.text_value)"' > "$OUTPUT_ENV_FILE"
      echo "$PAYLOAD_JSON" | jq -c '.entries[] | select(.binary_value != null) | {key: .key, value: .binary_value}' \
        | while read -r line; do
            key=$(echo "$line" | jq -r '.key')
            value_b64=$(echo "$line" | jq -r '.value')
            echo "$value_b64" | base64 --decode > "$OUTPUT_BINARY_DIR/$key"
          done

  - path: /opt/app/docker-compose.yml
    permissions: "0644"
    content: |
      services:
        db:
          build: .
          container_name: mysql8_yand_certs
          env_file: .env
          ports:
            - "3398:3306"
          volumes:
            - dbdata_yandex_sql_certs:/var/lib/mysql
      volumes:
        dbdata_yandex_sql_certs:

  - path: /opt/app/Dockerfile
    permissions: "0644"
    content: |
      FROM mysql:8.4
      ENV MYSQL_ROOT_PASSWORD=default
      EXPOSE 3306      

  - path: "/usr/local/etc/yc-install.sh"
    owner: yc-user:yc-user
    permissions: "0755"
    content: |
      #!/bin/bash

      # CLI
      echo "Installing Yandex Cloud CLI"
      curl \
        --silent \
        --show-error \
        --location \
        https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
      VM_ID=$(curl --silent http://169.254.169.254/latest/meta-data/instance-id)
      
      # Переходим в домашнюю директорию пользователя, чтобы все последующие команды
      # выполнялись в ней и имели права на запись файлов (например, key.json).
      cd /home/yc-user
      
      # Save YC params
      echo "Saving YC params to the ~/.bashrc"
      # Экранируем $HOME, чтобы он раскрылся во время выполнения скрипта от имени yc-user,
      # а не во время создания файла от имени root.
      cat << EOF >> /home/yc-user/.bashrc
        export PATH="/home/yc-user/yandex-cloud/bin:\$PATH"
        export YC_CLI_VM_ID="${VM_ID:-unknown}"
      EOF
      
      # Явно обновляем PATH для текущей сессии скрипта.
      # Это надежнее, чем `source` в cloud-init.
      export PATH="/home/yc-user/yandex-cloud/bin:$PATH"

      echo "SETTING YC +++++++++++++++++++++"

      yc iam key create \
        --service-account-name sc-scheduller-srv-acc \
        --output key.json \
        --folder-id b1gbgjv35qvro3lmgaci
      
      yc config profile create default
      yc config set service-account-key key.json
      yc config set cloud-id b1gib03pgvqrrfvhl3kb
      yc config set folder-id b1gbgjv35qvro3lmgaci

    defer: true


runcmd:
  - [su, yc-user, -c, "/usr/local/etc/yc-install.sh"]
  # 4. Делаем скрипт исполняемым для всех пользователей
  - 'chmod +x /home/yc-user/yandex-cloud/bin/*.sh'
  - systemctl enable --now docker
  - bash -lc 'cd /opt/app && ./yc-secrets-get.sh'
  - bash -lc 'cd /opt/app && docker compose build && docker compose up -d'

