name: mysql8_certs

services:
  db:
    image: mysql:8.4
    container_name: mysql8_certs
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "3391:3306"
    volumes:
      - type: volume
        source: dbdata_sql_certs
        target: /var/lib/mysql
      - type: bind
        source: ./mysql/conf.d
        target: /etc/mysql/conf.d
        read_only: true
      - type: bind
        source: ./mysql/init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ./mysql/certs
        target: /certs
        read_only: true

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    cpus: "2.0"

volumes:
  dbdata_sql_certs:
