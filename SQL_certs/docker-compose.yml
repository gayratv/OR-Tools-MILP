name: mysql8_certs

services:
  db:
    # Собираем образ из Dockerfile в текущей директории
    build: .
    container_name: mysql8_certs
    env_file: [.env]
    ports:
      - "3391:3306"
    volumes:
      # ОСТАВЛЯЕМ ТОЛЬКО ЭТОТ ТОМ для хранения данных базы.
      # Все остальное теперь встроено в образ.
      - type: volume
        source: dbdata_sql_certs
        target: /var/lib/mysql

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    cpus: "2.0"

volumes:
  dbdata_sql_certs: